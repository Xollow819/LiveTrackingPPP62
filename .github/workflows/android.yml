name: Android CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Install compile SDK
        run: sdkmanager "platforms;android-37"
      - name: Unit tests, lint, and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LiveTrackingPPP62-debug
          path: app/build/outputs/apk/debug/*.apk
